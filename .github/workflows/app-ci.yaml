name: app-ci

on:
  pull_request:
    paths:
      - "services/**"
      - "shared/**"
      - "pyproject.toml"
      - "nx.json"
      - ".nxignore"
      - "nx"
      - ".nx/nxw.js"
      - ".github/workflows/app-ci.yaml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "shared/**"
      - "pyproject.toml"
      - "nx.json"
      - ".nxignore"
      - "nx"
      - ".nx/nxw.js"
      - ".github/workflows/app-ci.yaml"

permissions:
  contents: read
  actions: read # nx-set-shas queries past workflow runs to find the base SHA

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which services need CI, and what runs for them, is decided by the Nx
  # project graph (project.json per service, shared as an implicit
  # dependency): a services/<svc>/ change affects only that service, a
  # shared/ or pyproject.toml change affects all 3. Lint and smoke-test
  # results are cached in Nx Cloud, so unchanged targets are restored
  # instead of re-run.
  ci:
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Exports NX_BASE/NX_HEAD: merge-base on PRs, last successful run's
      # SHA on pushes to main.
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: >
          pip install ruff==0.15.20
          -r services/auth/requirements.txt
          -r services/dashboard/requirements.txt
          -r services/redirect/requirements.txt
      - run: ./nx affected -t lint smoke-test docker-build
