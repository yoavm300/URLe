# EXAMPLE ONLY — do not commit real secrets. Copy to secret.yaml, fill in real
# values, and keep it out of git. In production prefer creating the Secret out of
# band, e.g.:
#   kubectl create secret generic urlshortener-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql://urlshortener:CHANGEME@postgres:5432/urlshortener" \
#     --from-literal=POSTGRES_USER=urlshortener \
#     --from-literal=POSTGRES_PASSWORD=CHANGEME \
#     --from-literal=POSTGRES_DB=urlshortener
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secrets
  labels:
    app: urlshortener
type: Opaque
stringData:
  # Must be identical across all app replicas (signs session cookies).
  SECRET_KEY: "REPLACE_WITH_A_LONG_RANDOM_VALUE"
  # The password here must match POSTGRES_PASSWORD below.
  DATABASE_URL: "postgresql://urlshortener:CHANGEME@postgres:5432/urlshortener"
  POSTGRES_USER: "urlshortener"
  POSTGRES_PASSWORD: "CHANGEME"
  POSTGRES_DB: "urlshortener"
