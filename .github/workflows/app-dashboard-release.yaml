name: app-dashboard-release

# SemVer tags only (vX.Y.Z) — no latest/branch tags ever reach the registry.
# All 3 services' release workflows share this same tag trigger — a release
# ships all 3 images at a matching version (see MANIFEST.md §5/§6).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS — no long-lived keys
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push SemVer + SHA tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -f services/dashboard/Dockerfile -t "$REGISTRY/urle-dashboard:$VERSION" .
          docker tag "$REGISTRY/urle-dashboard:$VERSION" "$REGISTRY/urle-dashboard:sha-${GITHUB_SHA::12}"
          docker push "$REGISTRY/urle-dashboard:$VERSION"
          docker push "$REGISTRY/urle-dashboard:sha-${GITHUB_SHA::12}"

  bump-chart:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump appVersion and chart versions to the released tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bump_patch() { awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}'; }

          yq -i ".appVersion = \"$VERSION\"" charts/urle-dashboard/Chart.yaml
          APP_CHART=$(yq '.version' charts/urle-dashboard/Chart.yaml | bump_patch)
          yq -i ".version = \"$APP_CHART\"" charts/urle-dashboard/Chart.yaml

          yq -i "(.dependencies[] | select(.name == \"urle-dashboard\") | .version) = \"$APP_CHART\"" charts/urle/Chart.yaml
          UMBRELLA=$(yq '.version' charts/urle/Chart.yaml | bump_patch)
          yq -i ".version = \"$UMBRELLA\" | .appVersion = \"$VERSION\"" charts/urle/Chart.yaml

          helm dependency update charts/urle
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/chart-bump-dashboard-${{ github.ref_name }}
          commit-message: "Bump urle-dashboard chart for ${{ github.ref_name }}"
          title: "Release ${{ github.ref_name }}: bump urle-dashboard chart appVersion"
          body: |
            Automated chart bump for image release `${{ github.ref_name }}` (urle-dashboard).
            Argo CD deploys this once merged.

            Note: app-auth-release and app-redirect-release open their own
            PRs against charts/urle/Chart.yaml for the same tag — merge order
            between them may need a rebase if they land close together.
