# cert-manager ClusterIssuer (§10 items 1 + 8). Kept in the umbrella chart
# (not templated into the cert-manager Helm release) so the ACME email/host
# stay env-valued and GitOps-managed. Gated: dev/minikube has no cert-manager
# CRDs, so it stays off there; enabled in values-prod.yaml. HTTP-01 solver
# uses the same ingress class as the app Ingress.
{{- if .Values.clusterIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  labels:
    app.kubernetes.io/part-of: urle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.server }}
    email: {{ required "clusterIssuer.email is required when clusterIssuer.enabled" .Values.clusterIssuer.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
{{- end }}
