# Per-service prod hardening. pdb/topologySpread/serviceAccount have no infra
# dependency and are on here. autoscaling is left off until Metrics Server is
# confirmed in-cluster (§10 item 3) — flip enabled: true once it is, or the
# HPA reports <unknown> and never scales.
urle-auth:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of infra/live/prod/ecr-auth).
    repository: 111111111111.dkr.ecr.eu-central-1.amazonaws.com/urle-auth
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

urle-dashboard:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of infra/live/prod/ecr-dashboard).
    repository: 111111111111.dkr.ecr.eu-central-1.amazonaws.com/urle-dashboard
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

urle-redirect:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of infra/live/prod/ecr-redirect).
    repository: 111111111111.dkr.ecr.eu-central-1.amazonaws.com/urle-redirect
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

ingress:
  host: urle.example.com
  # TLS on in prod (§10 item 8).
  tls:
    enabled: true

# ClusterIssuer on in prod (§10 items 1 + 8). Set a real ACME contact email.
clusterIssuer:
  enabled: true
  email: admin@example.com # replace with a real ops contact before apply

# Default-deny + minimal allows on in prod (§10 item 9). Needs the vpc-cni
# enableNetworkPolicy setting (§10 item 7) to actually enforce.
networkPolicy:
  enabled: true

postgres:
  enabled: false # prod uses RDS — DATABASE_URL in the Secret points at it

# Redis AUTH on in prod (§10 item 11). The shared Secret must then carry both
# REDIS_PASSWORD and the auth'd RATELIMIT_STORAGE_URI (redis://:PASS@redis:6379/0);
# the item-10 ExternalSecret supplies them from Secrets Manager.
redis:
  auth:
    enabled: true

# Sync urlshortener-secrets from Secrets Manager in prod (§10 item 10).
externalSecrets:
  enabled: true
  # Real ARN from `terragrunt output` of infra/live/prod/external-secrets.
  roleArn: arn:aws:iam::111111111111:role/urle-prod-external-secrets
  region: eu-central-1

# Grafana dashboards on in prod (§10 item 16).
grafana:
  dashboards:
    enabled: true
