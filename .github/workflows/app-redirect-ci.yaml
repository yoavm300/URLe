name: app-redirect-ci

on:
  pull_request:
    paths:
      - "services/redirect/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/app-redirect-ci.yaml"
  push:
    branches: [main]
    paths:
      - "services/redirect/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/app-redirect-ci.yaml"

permissions:
  contents: read

concurrency:
  group: app-redirect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20
      - run: ruff check shared/ services/redirect/
      - run: ruff format --check shared/ services/redirect/

  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/redirect/requirements.txt
      - name: App boots and /healthz returns 200
        env:
          SECRET_KEY: ci-smoke-test-key
          PYTHONPATH: .:services/redirect
        run: |
          python - <<'EOF'
          from app import create_app

          client = create_app().test_client()
          resp = client.get("/healthz")
          assert resp.status_code == 200, resp.status_code
          print("PASS: /healthz ->", resp.status_code)
          EOF

  docker-build:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only — pushing happens in app-redirect-release on SemVer tags.
      # Context is the repo root (not services/redirect/) so the Dockerfile
      # can COPY shared/.
      - run: docker build -f services/redirect/Dockerfile -t urle-redirect:ci .
