apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlshortener
  labels:
    app: urlshortener
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urlshortener
  template:
    metadata:
      labels:
        app: urlshortener
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: urlshortener
          image: your-registry/urlshortener:latest   # replace with your image
          ports:
            - containerPort: 5000
          # SECRET_KEY + DATABASE_URL from the Secret; the rest from the ConfigMap.
          envFrom:
            - secretRef:
                name: urlshortener-secrets
            - configMapRef:
                name: urlshortener-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              # 4 gunicorn workers + scrypt password hashing (memory-hard,
              # ~64MB transient per call) need headroom; 256Mi OOM-kills on
              # register.
              memory: "512Mi"
