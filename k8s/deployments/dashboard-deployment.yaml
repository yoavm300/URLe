apiVersion: apps/v1
kind: Deployment
metadata:
  name: urle-dashboard
  namespace: urle
  labels:
    app: urle-dashboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urle-dashboard
  template:
    metadata:
      labels:
        app: urle-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: urle-dashboard
          image: urle-dashboard:dev   # replace with your registry image for non-local use
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          # SECRET_KEY + DATABASE_URL from the Secret; the rest from the ConfigMap.
          envFrom:
            - secretRef:
                name: urlshortener-secrets
            - configMapRef:
                name: urlshortener-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
