name: infra-apply

# Apply changes to a LIVE environment. Never automatic — a human dispatches
# it, and a fresh per-unit plan runs as a mandatory gate in the same run.
# For a torn-down environment use infra-bootstrap.yaml instead (plan genuinely
# fails against one; see infra-ci.yaml).
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

concurrency:
  group: infra-mutate-${{ inputs.env }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.7"
  TG_VERSION: "1.0.8"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    steps:
      # workflow_dispatch can be run from any branch a user picks — only ever
      # apply what main actually contains.
      - name: Fail closed off main
        if: github.ref_name != 'main'
        run: |
          echo "::error::infra-apply must be dispatched from main (got '${{ github.ref_name }}')"
          exit 1
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.env == 'dev' && vars.AWS_DEV_CI_ROLE_ARN || vars.AWS_PROD_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terragrunt plan per unit
        working-directory: terraform/terragrunt/${{ inputs.env }}
        env:
          ADMIN_PRINCIPAL_ARN: ${{ secrets.ADMIN_PRINCIPAL_ARN }}
        run: |
          status=0
          for unit in */; do
            unit="${unit%/}"
            [ -f "$unit/terragrunt.hcl" ] || continue
            echo "::group::terragrunt plan - $unit"
            (cd "$unit" && terragrunt plan --non-interactive) || status=1
            echo "::endgroup::"
          done
          exit $status

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }} # a required reviewer on prod gates this job
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.env == 'dev' && vars.AWS_DEV_CI_ROLE_ARN || vars.AWS_PROD_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terragrunt apply
        working-directory: terraform/terragrunt/${{ inputs.env }}
        env:
          ADMIN_PRINCIPAL_ARN: ${{ secrets.ADMIN_PRINCIPAL_ARN }}
        run: terragrunt run --all --non-interactive -- apply -auto-approve
