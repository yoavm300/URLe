# Per-service prod hardening. pdb/topologySpread/serviceAccount have no infra
# dependency and are on here. autoscaling is left off until Metrics Server is
# confirmed in-cluster (§10 item 3) — flip enabled: true once it is, or the
# HPA reports <unknown> and never scales.
urle-auth:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of terraform/environments/global/ecr-auth, or /urle/global/ecr/urle-auth/repository-url in SSM).
    repository: 095887736740.dkr.ecr.us-east-1.amazonaws.com/urle-auth
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

urle-dashboard:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of terraform/environments/global/ecr-dashboard, or /urle/global/ecr/urle-dashboard/repository-url in SSM).
    repository: 095887736740.dkr.ecr.us-east-1.amazonaws.com/urle-dashboard
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

urle-redirect:
  replicaCount: 3
  image:
    # Set to the real ECR repository URL (output of terraform/environments/global/ecr-redirect, or /urle/global/ecr/urle-redirect/repository-url in SSM).
    repository: 095887736740.dkr.ecr.us-east-1.amazonaws.com/urle-redirect
  pdb:
    enabled: true
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
  serviceAccount:
    create: true
  metrics:
    serviceMonitor:
      enabled: true
      # Must match the kube-prometheus-stack (item 6) serviceMonitorSelector.
      labels:
        release: kube-prometheus-stack

# Public edge: CloudFront (terraform/environments/prod/cloudfront) -> ALB ->
# ingress-nginx -> this Ingress -> Services -> pods. The ALB and its routing
# to the nginx controller live in terraform (prod/ingress-nginx's edge
# Ingress, alb class) — this Ingress is nginx-class and only does the
# in-cluster path routing, same as dev. TLS is ACM at CloudFront and the ALB;
# ALB->nginx->pod is plain HTTP in-VPC, so cert-manager stays out of prod.
ingress:
  className: nginx
  # One-time fill: the apex domain from terraform/environments/global/route53-public-zone.
  # CloudFront forwards the viewer's Host header end to end, so nginx matches
  # this public name — and request.host_url builds short links right. (The
  # CloudFront origin hostname only exists at the edge Ingress, never here.)
  host: url-e.online
  tls:
    enabled: false # ACM at CloudFront/ALB, not a cert-manager Secret

clusterIssuer:
  enabled: false # prod TLS is ACM at the ALB (see ingress above)

config:
  # Number of trusted proxy hops (ProxyFix x_for). Prod is CloudFront -> ALB
  # -> nginx -> pod = 3 (nginx appends the ALB's IP via
  # compute-full-forwarded-for); with the wrong count, rate limiting keys on
  # the wrong IP in the X-Forwarded-For chain and throttles all clients
  # collectively.
  trustProxy: "3"

# Default-deny + minimal allows on in prod (§10 item 9). Needs the vpc-cni
# enableNetworkPolicy setting (§10 item 7) to actually enforce. App traffic
# arrives from the nginx controller pods, covered by the base
# ingressNamespace allow — the ALB only ever targets nginx, never app pods,
# so no albSourceCidr ipBlock.
networkPolicy:
  enabled: true

# Worst case: 3 services × HPA maxReplicas 6 × (100m/256Mi req, 500m/512Mi
# lim) + redis (50m/64Mi req, 200m/128Mi lim) + the init-db hook Job's own
# footprint (100m/128Mi req, 500m/256Mi lim, counted explicitly — not left to
# incidental headroom) — sized so flipping autoscaling on later never trips
# the quota. No in-cluster postgres in prod (RDS).
resourceQuota:
  enabled: true
  requests:
    cpu: 2000m
    memory: 5Gi
  limits:
    cpu: 10000m
    memory: 10Gi

limitRange:
  enabled: true

postgres:
  enabled: false # prod uses RDS — DATABASE_URL in the Secret points at it

# Redis AUTH on in prod (§10 item 11). The shared Secret must then carry both
# REDIS_PASSWORD and the auth'd RATELIMIT_STORAGE_URI (redis://:PASS@redis:6379/0);
# the item-10 ExternalSecret supplies them from Secrets Manager.
redis:
  auth:
    enabled: true

# Sync urlshortener-secrets from Secrets Manager in prod (§10 item 10).
externalSecrets:
  enabled: true
  # Real ARN from `terragrunt output` of terraform/environments/prod/external-secrets.
  roleArn: arn:aws:iam::095887736740:role/urle-prod-external-secrets
  region: us-east-1

# Grafana dashboards on in prod (§10 item 16).
grafana:
  dashboards:
    enabled: true
