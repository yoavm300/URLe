name: charts-ci

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/charts-ci.yaml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/charts-ci.yaml"

permissions:
  contents: read

concurrency:
  group: charts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint helm/auth helm/dashboard helm/redirect helm/postgres helm/redis
      # "update" (not "build") since no Chart.lock is committed — it always
      # recomputes from Chart.yaml + the file:// subchart paths, so it
      # self-heals even if the vendored helm/urle-chart/charts/*.tgz drift.
      - run: helm dependency update helm/urle-chart
      - run: helm lint helm/urle-chart
      - name: Render umbrella chart for both environments
        run: |
          helm template urle-dev helm/urle-chart -f helm/urle-chart/values-dev.yaml > /dev/null
          helm template urle-prod helm/urle-chart -f helm/urle-chart/values-prod.yaml > /dev/null

  version-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed charts must bump their SemVer version
        run: |
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          failed=0
          for chart in auth dashboard redirect postgres redis urle-chart; do
            if ! git diff --quiet "$base" -- "helm/$chart"; then
              old=$(git show "$base:helm/$chart/Chart.yaml" 2>/dev/null | yq '.version' || echo "")
              new=$(yq '.version' "helm/$chart/Chart.yaml")
              if [ "$old" = "$new" ]; then
                echo "::error::helm/$chart changed but Chart.yaml version is still $new"
                failed=1
              fi
            fi
          done
          exit $failed
