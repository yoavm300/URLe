apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None # headless service for the StatefulSet
  selector:
    app: {{ include "postgres.fullname" . }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
