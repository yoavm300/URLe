apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urlshortener
  labels:
    app: urlshortener
  annotations:
    # Adjust to your ingress controller (this example targets ingress-nginx).
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: urlshortener.example.com        # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urlshortener
                port:
                  number: 80
