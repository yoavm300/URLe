apiVersion: v2
name: urle
description: Umbrella chart composing the URLe URL shortener stack
type: application
version: 1.3.1
appVersion: "1.0.0"
dependencies:
  - name: urle-auth
    version: 1.1.0
    repository: file://../auth
  - name: urle-dashboard
    version: 1.1.0
    repository: file://../dashboard
  - name: urle-redirect
    version: 1.1.0
    repository: file://../redirect
  - name: postgres
    version: 1.1.1
    repository: file://../postgres
    condition: postgres.enabled
  - name: redis
    version: 1.1.1
    repository: file://../redis
    condition: redis.enabled
