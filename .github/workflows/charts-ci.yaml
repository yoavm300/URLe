name: charts-ci

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/charts-ci.yaml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/charts-ci.yaml"

permissions:
  contents: read

concurrency:
  group: charts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint helm/urle-chart/charts/urle-auth helm/urle-chart/charts/urle-dashboard helm/urle-chart/charts/urle-redirect helm/urle-chart/charts/postgres helm/urle-chart/charts/redis
      # Subcharts are vendored directly under helm/urle-chart/charts/ (no
      # repository: field, no fetch) — this just verifies Chart.lock's
      # recorded versions still match what's committed there.
      - run: helm dependency update helm/urle-chart
      - run: helm lint helm/urle-chart
      - name: Render umbrella chart for both environments
        run: |
          helm template urle-dev helm/urle-chart -f helm/urle-chart/values-dev.yaml > /dev/null
          helm template urle-prod helm/urle-chart -f helm/urle-chart/values-prod.yaml > /dev/null

  version-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed charts must bump their SemVer version
        run: |
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          failed=0
          for chart in urle-auth urle-dashboard urle-redirect postgres redis; do
            dir="helm/urle-chart/charts/$chart"
            if ! git diff --quiet "$base" -- "$dir"; then
              old=$(git show "$base:$dir/Chart.yaml" 2>/dev/null | yq '.version' || echo "")
              new=$(yq '.version' "$dir/Chart.yaml")
              if [ "$old" = "$new" ]; then
                echo "::error::$dir changed but Chart.yaml version is still $new"
                failed=1
              fi
            fi
          done

          # Umbrella: own files only — each subchart is already checked
          # above, so excluding charts/ here avoids double-flagging a
          # subchart-only change as an umbrella change.
          if ! git diff --quiet "$base" -- helm/urle-chart ':!helm/urle-chart/charts'; then
            old=$(git show "$base:helm/urle-chart/Chart.yaml" 2>/dev/null | yq '.version' || echo "")
            new=$(yq '.version' helm/urle-chart/Chart.yaml)
            if [ "$old" = "$new" ]; then
              echo "::error::helm/urle-chart changed but Chart.yaml version is still $new"
              failed=1
            fi
          fi
          exit $failed
