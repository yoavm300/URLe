apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urle-dashboard.fullname" . }}
  labels:
    {{- include "urle-dashboard.labels" . | nindent 4 }}
  annotations:
    # App rolls out after the datastores (wave 0) and init-db job (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "urle-dashboard.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "urle-dashboard.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: urle-dashboard
          image: {{ include "urle-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          # SECRET_KEY + DATABASE_URL from the Secret; the rest from the ConfigMap.
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
            - configMapRef:
                name: {{ .Values.existingConfigMap }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
