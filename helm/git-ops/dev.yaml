apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: urle-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: urle
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: urle
  source:
    repoURL: https://github.com/yoavm300/URLe.git
    targetRevision: main
    path: helm/urle-chart
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: urle-dev
  syncPolicy:
    # Stamp the Pod Security Standards label onto the namespace Argo CD creates
    # (§10 item 17). All workloads are 'restricted'-compliant (non-root,
    # no privilege escalation, dropped caps, RuntimeDefault seccomp), so
    # enforcement rejects any future manifest that regresses. NOTE: dev also
    # runs the in-cluster postgres/redis — validate their non-root uids on
    # first sync (see chart comments) since this env enforces too.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
