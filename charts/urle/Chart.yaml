apiVersion: v2
name: urle
description: Umbrella chart composing the URLe URL shortener stack
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: urlshortener
    version: 1.0.0
    repository: file://../urlshortener
  - name: postgres
    version: 1.0.0
    repository: file://../postgres
    condition: postgres.enabled
  - name: redis
    version: 1.0.0
    repository: file://../redis
    condition: redis.enabled
