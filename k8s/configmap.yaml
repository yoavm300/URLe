apiVersion: v1
kind: ConfigMap
metadata:
  name: urlshortener-config
  labels:
    app: urlshortener
data:
  # Shared rate-limit store so limits apply across replicas (not per-pod).
  RATELIMIT_STORAGE_URI: "redis://redis:6379/0"
  # Trust X-Forwarded-* from the ingress so the real client IP is used.
  TRUST_PROXY: "1"
