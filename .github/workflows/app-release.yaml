name: app-release

# SemVer tags only (vX.Y.Z) — no latest/branch tags ever reach the registry.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS — no long-lived keys
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push SemVer + SHA tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "$REGISTRY/urlshortener:$VERSION" .
          docker tag "$REGISTRY/urlshortener:$VERSION" "$REGISTRY/urlshortener:sha-${GITHUB_SHA::12}"
          docker push "$REGISTRY/urlshortener:$VERSION"
          docker push "$REGISTRY/urlshortener:sha-${GITHUB_SHA::12}"

  bump-chart:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump appVersion and chart versions to the released tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bump_patch() { awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}'; }

          yq -i ".appVersion = \"$VERSION\"" charts/urlshortener/Chart.yaml
          APP_CHART=$(yq '.version' charts/urlshortener/Chart.yaml | bump_patch)
          yq -i ".version = \"$APP_CHART\"" charts/urlshortener/Chart.yaml

          yq -i "(.dependencies[] | select(.name == \"urlshortener\") | .version) = \"$APP_CHART\"" charts/urle/Chart.yaml
          UMBRELLA=$(yq '.version' charts/urle/Chart.yaml | bump_patch)
          yq -i ".version = \"$UMBRELLA\" | .appVersion = \"$VERSION\"" charts/urle/Chart.yaml

          helm dependency update charts/urle
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/chart-bump-${{ github.ref_name }}
          commit-message: "Bump charts for ${{ github.ref_name }}"
          title: "Release ${{ github.ref_name }}: bump chart appVersion"
          body: |
            Automated chart bump for image release `${{ github.ref_name }}`.
            Argo CD deploys this once merged.
