name: infra-destroy

# Tear down an environment for cost. Requires typing the environment name as
# confirmation. Survivors by design: everything in terraform/terragrunt/global (OIDC
# roles, ECR images, public zone) plus destroy-excluded units (prod RDS, ACM)
# — see the exclude blocks in those units.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-mutate-${{ inputs.env }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.7"
  TG_VERSION: "1.0.8"

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }} # a required reviewer on prod gates this too
    permissions:
      contents: read
      id-token: write
      actions: write # flips the <ENV>_UP repo variable
    steps:
      - name: Confirm target
        if: inputs.confirm != inputs.env
        run: |
          echo "::error::Confirmation '${{ inputs.confirm }}' does not match environment '${{ inputs.env }}' — nothing destroyed"
          exit 1
      - name: Fail closed off main
        if: github.ref_name != 'main'
        run: |
          echo "::error::infra-destroy must be dispatched from main (got '${{ github.ref_name }}')"
          exit 1
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.env == 'dev' && vars.AWS_DEV_CI_ROLE_ARN || vars.AWS_PROD_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Karpenter-launched nodes exist outside Terraform state: destroying the
      # karpenter unit deletes the NodePool CR without waiting for the nodes,
      # then uninstalls the controller that would have terminated them. The
      # orphans keep ENIs on the cluster security group and the eks unit's
      # destroy fails with DependencyViolation. Drain them first, while the
      # controller is still alive — and terminate directly whatever remains.
      - name: Drain Karpenter nodes
        env:
          CLUSTER: urle-${{ inputs.env }} # must match cluster_name in terragrunt/<env>/env.hcl
        run: |
          set -uo pipefail
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "$CLUSTER"
            # NodePool finalizers block deletion until the controller has
            # drained and terminated every node it launched.
            kubectl delete nodepools.karpenter.sh --all --ignore-not-found --wait --timeout=10m \
              || echo "::warning::NodePool deletion timed out or failed — falling back to direct termination"
          fi
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag-key,Values=karpenter.sh/nodepool" \
                      "Name=tag:kubernetes.io/cluster/$CLUSTER,Values=owned" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then
            echo "Terminating leftover Karpenter instances: $ids"
            aws ec2 terminate-instances --instance-ids $ids
            aws ec2 wait instance-terminated --instance-ids $ids
          fi
      # ArgoCD deploys the app's ExternalSecret/SecretStore CRs outside
      # Terraform state (urle-chart via GitOps). The argocd unit is torn down
      # before external-secrets but doesn't prune them first, so if they're
      # still around when external-secrets' helm release is uninstalled, the
      # operator pod (and its finalizer-clearing controller) dies before the
      # CR's finalizer is removed — the CR sticks in Terminating forever,
      # blocking the CRD delete and timing out the whole destroy. Strip the
      # finalizers up front, while the operator is still alive.
      - name: Clear ExternalSecret/SecretStore finalizers
        env:
          CLUSTER: urle-${{ inputs.env }}
        run: |
          set -uo pipefail
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "$CLUSTER"
            for kind in externalsecrets.external-secrets.io secretstores.external-secrets.io clustersecretstores.external-secrets.io; do
              kubectl get "$kind" -A --ignore-not-found \
                  -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                | while read -r ns name; do
                    [ -z "$name" ] && continue
                    kubectl patch "$kind" "$name" ${ns:+-n "$ns"} --type=merge -p '{"metadata":{"finalizers":[]}}' || true
                  done
            done
          fi
      - name: Terragrunt destroy
        working-directory: terraform/terragrunt/${{ inputs.env }}
        env:
          ADMIN_PRINCIPAL_ARN: ${{ secrets.ADMIN_PRINCIPAL_ARN }}
        run: terragrunt run --all --non-interactive -- destroy -auto-approve
      - name: Mark environment as down (skips plan-on-PR)
        if: always() # even a partial destroy means plans can no longer be trusted
        env:
          GH_TOKEN: ${{ secrets.VARS_TOKEN || github.token }}
        run: gh variable set "$(echo '${{ inputs.env }}' | tr a-z A-Z)_UP" --body "false" --repo "$GITHUB_REPOSITORY"
