# Dedicated ServiceAccount so the service doesn't run under the namespace
# "default" SA. Token is not mounted — this service never calls the
# Kubernetes API, so it has no reason to carry a credential for it.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urle-dashboard.fullname" . }}
  labels:
    {{- include "urle-dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
