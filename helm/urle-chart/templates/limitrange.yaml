# Per-container defaults so a pod spec that forgets requests/limits (e.g. a
# one-off debug pod, a future job) still lands inside the ResourceQuota
# instead of being rejected for having no requests at all.
{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: urle-limits
  labels:
    app.kubernetes.io/part-of: urle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequest.cpu | quote }}
        memory: {{ .Values.limitRange.defaultRequest.memory | quote }}
      default:
        cpu: {{ .Values.limitRange.default.cpu | quote }}
        memory: {{ .Values.limitRange.default.memory | quote }}
{{- end }}
