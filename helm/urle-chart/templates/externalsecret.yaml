# Prod path for getting `urlshortener-secrets` into the cluster from AWS
# Secrets Manager, via the External Secrets Operator (§10 items 5 + 10).
# Off by default — dev/minikube creates the Secret out of band
# (`kubectl create secret`, see k8s/README.md). Enabled in values-prod.yaml.
#
# Three objects, all required together:
#   1. ServiceAccount annotated with the IRSA role (item 5 output) so the
#      SecretStore can assume it — IRSA maps this SA to the AWS role.
#   2. SecretStore pointing at Secrets Manager, authenticating as that SA.
#      Without the store the ExternalSecret's secretStoreRef dangles and the
#      CRD reconciles to an error (callout G).
#   3. ExternalSecret that materialises the target Secret from one JSON secret
#      in Secrets Manager (keys: SECRET_KEY, DATABASE_URL, REDIS_PASSWORD,
#      RATELIMIT_STORAGE_URI — everything the app, redis, and RDS wiring need).
#
# apiVersion is external-secrets.io/v1 — required by ESO >= 1.0 (v1beta1 is
# no longer served by the 2.x operator pinned in terraform/modules/external-secrets).
{{- if .Values.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccountName }}
  labels:
    app.kubernetes.io/part-of: urle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "externalSecrets.roleArn is required when externalSecrets.enabled" .Values.externalSecrets.roleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    app.kubernetes.io/part-of: urle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.targetSecret }}
  labels:
    app.kubernetes.io/part-of: urle
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.targetSecret }}
    creationPolicy: Owner
  # Pull every property of the JSON secret into a same-named key of the
  # target Secret.
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
{{- end }}
