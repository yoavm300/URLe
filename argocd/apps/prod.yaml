apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: urle-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: urle
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: urle
  source:
    repoURL: https://github.com/yoavm300/URLe.git
    targetRevision: main
    path: charts/urle
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: urle-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
